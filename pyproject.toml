[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-portfolio-rebalancer"
version = "1.0.0"
description = "Enterprise-Grade Autonomous Portfolio Rebalancing System with XAI & Compliance"
authors = [{ name = "AI Engineering Team" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "cvxpy>=1.3.0",
    "shap>=0.42.0",
    "lime>=0.2.0.1",
    "scikit-learn>=1.2.0",
    "streamlit>=1.25.0",
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
include = ["agents*", "backtesting*", "compliance*", "data*", "engine*", "explainability*", "override*"]
exclude = ["dashboard*", "docs*", "notebook*", "adr*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=. --cov-report=term-missing"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]